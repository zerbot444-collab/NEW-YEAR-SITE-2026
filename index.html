<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Under Maintenance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-style: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0f0c20;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Moving Tech Background Grid & Lights */
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(rgba(0, 242, 254, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 254, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: moveGrid 20s linear infinite;
            z-index: 1;
        }

        .glow-circle {
            position: absolute;
            width: 300px;
            height: 300px;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            filter: blur(150px);
            border-radius: 50%;
            opacity: 0.2;
            z-index: 1;
            animation: floatGlow 8s ease-in-out infinite alternate;
        }

        .glow-1 { top: 10%; left: 15%; }
        .glow-2 { bottom: 10%; right: 15%; animation-delay: -4s; }

        /* Main Glassmorphism Card */
        .container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem 2rem;
            border-radius: 24px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            animation: fadeIn 1.2s ease-out;
        }

        /* Animated Tech Icon */
        .tech-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 2rem;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .circle-outer {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px dashed #00f2fe;
            border-radius: 50%;
            animation: rotate 10s linear infinite;
        }

        .circle-inner {
            position: absolute;
            width: 70%;
            height: 70%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top: 2px solid #4facfe;
            border-radius: 50%;
            animation: rotateReverse 4s linear infinite;
        }

        .tech-icon::after {
            content: '</>';
            font-weight: bold;
            color: #00f2fe;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        /* Typography */
        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #fff, #b3e5fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        p {
            color: #a0aec0;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        /* Pulse Progress Bar */
        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 2.5rem;
        }

        .progress-bar {
            height: 100%;
            width: 50%;
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            border-radius: 10px;
            animation: loading 2s ease-in-out infinite;
        }

        /* Owner Tag */
        .owner-tag {
            display: inline-block;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 1.5rem;
            width: 100%;
            letter-spacing: 1px;
        }

        .owner-name {
            color: #00f2fe;
            font-weight: 600;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }

        /* Keyframe Animations */
        @keyframes moveGrid {
            0% { background-position: 0 0; }
            100% { background-position: 40px 40px; }
        }

        @keyframes floatGlow {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-30px) scale(1.1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes rotateReverse {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        @keyframes loading {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>
<body>

    <div class="glow-circle glow-1"></div>
    <div class="glow-circle glow-2"></div>

    <div class="container">
        <div class="tech-icon">
            <div class="circle-outer"></div>
            <div class="circle-inner"></div>
        </div>

        <h1>System Maintenance</h1>
        <p>We are currently upgrading our systems to serve you better. We'll be back online shortly with a fresh look and faster experience.</p>
        
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>

        <div class="owner-tag">
            OWNER: <span class="owner-name">Vishathbkaushika</span>
        </div>
    </div>

</body>
</html>
